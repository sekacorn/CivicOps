spring:
  application:
    name: civicops-api
  datasource:
    url: ${CIVICOPS_DATABASE_URL:jdbc:postgresql://localhost:5432/civicops}
    username: ${CIVICOPS_DATABASE_USERNAME:civicops}
    password: ${CIVICOPS_DATABASE_PASSWORD:civicops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
civicops:
  security:
    jwt:
      secret: ${CIVICOPS_JWT_SECRET:}
      access-token-ttl: ${CIVICOPS_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${CIVICOPS_REFRESH_TOKEN_TTL:P30D}
